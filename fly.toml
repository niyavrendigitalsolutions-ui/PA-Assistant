# Change `app` to a name nobody else has taken on Fly.io.
app = "niyavren-assistant"
primary_region = "sin"   # Singapore. Mumbai (bom) is no longer offered for new volumes

[build]

[env]
  ASSISTANT_DATA_DIR = "/data"
  ASSISTANT_TZ = "Asia/Kolkata"
  ASSISTANT_NAME = "Nova"

[mounts]
  source = "assistant_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # must stay running to deliver reminders
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
